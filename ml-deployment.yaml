apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-inference-deployment
  namespace: mlops-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ml-api
  template:
    metadata:
      labels:
        app: ml-api
    spec:
      containers:
        - name: ml-api
          image: ml-model-api:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: ml-api-service
  namespace: mlops-lab
spec:
  type: NodePort
  selector:
    app: ml-api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080